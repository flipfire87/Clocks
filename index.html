<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World clocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #eef0f5;
    --ink: #151a33;
    --muted: #5b6285;
    --line: #cfd4e4;
    --field: #ffffff;
    --accent: #3a4bd1;
    --accent-ink: #ffffff;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1020;
      --ink: #e8eaf8;
      --muted: #9aa1c9;
      --line: #2a3057;
      --field: #161a33;
      --accent: #8c9bff;
      --accent-ink: #0d1020;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1020;
    --ink: #e8eaf8;
    --muted: #9aa1c9;
    --line: #2a3057;
    --field: #161a33;
    --accent: #8c9bff;
    --accent-ink: #0d1020;
  }
  html { background: #000; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: #000;
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { position: relative; max-width: none; min-height: 100vh; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.1; letter-spacing: -0.02em; margin: 0; }

  .addbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .add { display: flex; gap: 8px; }
  .addbar .seg { margin-left: auto; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  input[type="text"] {
    font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; width: 280px; max-width: 100%;
  }
  button { font: inherit; cursor: pointer; }
  .btn {
    border: 1px solid transparent; background: var(--accent); color: var(--accent-ink);
    border-radius: 12px; padding: 10px 16px; font-weight: 600;
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--field); }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 10px 14px; font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg { flex: 1 1 100%; min-height: 1.4em; margin: 0; color: var(--muted); font-size: 0.92rem; }

  .grid { display: grid; flex: 1; grid-auto-rows: 1fr; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 440px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .card {
    position: relative; border-radius: 22px; padding: clamp(16px, 1.2vw, 24px); overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    transition: background 1s linear, color 1s linear;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .city { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 2.7vw, 3.6rem); line-height: 1.1; margin: 0; }
  .region { font-size: clamp(1rem, 1.2vw, 1.7rem); opacity: 0.75; margin: 2px 0 0; }
  .remove {
    background: transparent; border: 0; color: inherit; opacity: 0.55; font-size: 1.3rem; line-height: 1;
    width: 32px; height: 32px; border-radius: 50%; flex: none;
  }
  .remove:hover { opacity: 1; background: rgba(127,127,127,0.25); }
  @media (hover: hover) {
    .remove { opacity: 0; }
    .card:hover .remove, .remove:focus-visible { opacity: 0.7; }
    .card .remove:hover { opacity: 1; }
  }

  svg.face { width: clamp(80px, 9vh, 170px); height: clamp(80px, 9vh, 170px); align-self: center; display: block; }
  .hand { stroke: currentColor; stroke-linecap: round; }
  .face .rim { fill: none; stroke: currentColor; stroke-opacity: 0.3; stroke-width: 1.2; }

  .digital { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 6px; font-family: var(--display); font-variant-numeric: tabular-nums; }
  .hm { font-size: clamp(2.6rem, min(5vw, 9.5vh), 8rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .sec { font-size: clamp(1.3rem, 2vw, 2.8rem); opacity: 0.7; font-weight: 500; }
  .ampm { font-size: clamp(1.1rem, 1.6vw, 2.2rem); font-weight: 700; opacity: 1; }
  .date { text-align: center; margin: 0; font-weight: 500; font-size: clamp(1.2rem, 1.7vw, 2.4rem); }

  .strip { position: relative; height: 10px; border-radius: 6px; margin-top: auto; }
  .marker {
    position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px;
    background: currentColor; box-shadow: 0 0 0 2px rgba(127,127,127,0.35); transform: translateX(-2px);
  }
  .meta { display: flex; justify-content: space-between; gap: 8px; font-size: clamp(0.9rem, 1vw, 1.4rem); opacity: 0.85; margin: 0; }

  .empty { grid-column: 1 / -1; padding: 40px 0; color: #9aa1c9; }

  .card { cursor: grab; user-select: none; -webkit-user-select: none; }
  .region, .date, .meta { line-height: 1.2; }
  .utcbar { display: flex; align-items: baseline; justify-content: center; gap: 18px; padding: 2px 0 12px; color: #ffffff; font-family: var(--display); font-variant-numeric: tabular-nums; }
  .utc-label { font-size: clamp(1rem, 1.2vw, 1.6rem); font-weight: 600; letter-spacing: 0.14em; color: #9aa1c9; }
  .utc-time { font-size: clamp(1.6rem, 2.4vw, 3.2rem); font-weight: 700; line-height: 1; }
  .utc-date { font-size: clamp(1rem, 1.2vw, 1.6rem); color: #9aa1c9; }
  .logo { position: absolute; top: 18px; left: 30px; height: clamp(20px, 2vw, 52px); width: auto; display: block; pointer-events: none; user-select: none; }

  .card .city.long { white-space: nowrap; letter-spacing: -0.02em; }

  /* Large, tall screens such as 1920x1200: use the extra height for bigger text */
  @media (min-width: 1700px) and (min-height: 1040px) {
    .card { padding: 1.3vw; }
    .city { font-size: 3vw; }
    .region { font-size: 1.35vw; }
    svg.face { width: 11vh; height: 11vh; }
    .hm { font-size: min(5.4vw, 10.5vh); }
    .sec { font-size: 2.1vw; }
    .ampm { font-size: 1.7vw; }
    .date { font-size: 1.9vw; }
    .meta { font-size: 1.1vw; }
    .utc-time { font-size: 2.8vw; }
    .utc-label, .utc-date { font-size: 1.3vw; }
    .logo { height: 2.3vw; top: 20px; }
  }
  .card.dragging { z-index: 20; pointer-events: none; cursor: grabbing; transition: none; box-shadow: 0 18px 50px rgba(0,0,0,0.7); }
  .card.drop-target { outline: 3px solid #fff; outline-offset: -3px; }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
  @media (pointer: fine) { .card { touch-action: none; } }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  @media (max-width: 520px) { .add { width: 100%; } input[type="text"] { flex: 1; width: auto; } }
</style>
</head>

  <div class="utcbar" role="timer" aria-label="Coordinated Universal Time">
    <span class="utc-label">UTC</span>
    <span class="utc-time" id="utcTime"></span>
    <span class="utc-date" id="utcDate"></span>
  </div>
  <main class="grid" id="grid"></main>

<script>
(function () {
  var DEFAULT_ZONES = ["Australia/Sydney", "Australia/Perth", "Pacific/Auckland", "Asia/Hong_Kong", "Asia/Dubai", "America/New_York", "Europe/London", "Asia/Tokyo"];
  var FALLBACK_LIST = ["Pacific/Auckland","Australia/Perth","Asia/Singapore","Asia/Hong_Kong","Asia/Shanghai","Asia/Seoul","Europe/Paris","Europe/Berlin","Europe/Moscow","Africa/Cairo","Africa/Johannesburg","America/Sao_Paulo","America/Chicago","America/Denver","America/Toronto","Pacific/Honolulu","UTC"];

  var zones = DEFAULT_ZONES.slice();
  try {
    var savedOrder = JSON.parse(localStorage.getItem("wc-order") || "null");
    if (Array.isArray(savedOrder) && savedOrder.length === DEFAULT_ZONES.length &&
        savedOrder.slice().sort().join("|") === DEFAULT_ZONES.slice().sort().join("|")) zones = savedOrder;
  } catch (e) {}
  var use24 = true;

  var grid = document.getElementById("grid");
  var cards = {};
  var fmtCache = {};

  var localTz = (function () {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; }
  })();

  function realTz(z) { return z === "local" ? localTz : z; }

  function getFmt(tz) {
    if (!fmtCache[tz]) {
      fmtCache[tz] = new Intl.DateTimeFormat("en-GB", {
        timeZone: tz, hourCycle: "h23", weekday: "short", year: "numeric", month: "numeric",
        day: "numeric", hour: "numeric", minute: "numeric", second: "numeric"
      });
    }
    return fmtCache[tz];
  }

  function parts(tz, date) {
    var o = {};
    getFmt(tz).formatToParts(date).forEach(function (p) { o[p.type] = p.value; });
    var r = {
      y: +o.year, mo: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second, wd: o.weekday
    };
    var asUtc = Date.UTC(r.y, r.mo - 1, r.d, r.h, r.mi, r.s);
    r.offset = Math.round((asUtc - Math.floor(date.getTime() / 1000) * 1000) / 60000);
    r.dayNum = Math.floor(Date.UTC(r.y, r.mo - 1, r.d) / 86400000);
    return r;
  }

  function fmtOffset(min) {
    var sign = min < 0 ? "−" : "+";
    var a = Math.abs(min), h = Math.floor(a / 60), m = a % 60;
    return "UTC" + sign + h + (m ? ":" + String(m).padStart(2, "0") : "");
  }

  function nameFor(z) {
    if (z === "local") {
      var n = localTz.split("/").pop().replace(/_/g, " ");
      return { city: "Your time", region: n };
    }
    var bits = z.split("/");
    var city = ({ "Asia/Dubai": "Abu Dhabi", "Asia/Hong_Kong": "Hong Kong/SGP" })[z] || bits[bits.length - 1].replace(/_/g, " ");
    var region = bits.length > 1 ? bits[0].replace(/_/g, " ") : "Universal";
    return { city: city, region: region };
  }

  /* Sky colours over a local day */
  var SKY = [
    [0, [20, 24, 58]], [4.5, [34, 36, 84]], [6, [122, 104, 170]], [7, [232, 160, 150]],
    [9, [128, 186, 230]], [13, [88, 166, 238]], [17, [138, 176, 226]], [18.7, [214, 128, 150]],
    [20, [86, 62, 130]], [21.5, [34, 34, 78]], [24, [20, 24, 58]]
  ];
  function skyAt(h) {
    for (var i = 0; i < SKY.length - 1; i++) {
      var a = SKY[i], b = SKY[i + 1];
      if (h >= a[0] && h <= b[0]) {
        var t = (h - a[0]) / (b[0] - a[0]);
        return [0, 1, 2].map(function (k) { return Math.round(a[1][k] + (b[1][k] - a[1][k]) * t); });
      }
    }
    return SKY[0][1];
  }
  var TILE_COLOURS = { "Asia/Dubai": [195, 176, 145] };
  function lum(c) { return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
  var stripGradient = "linear-gradient(90deg," + SKY.map(function (s) {
    return "rgb(" + s[1].join(",") + ") " + (s[0] / 24 * 100).toFixed(1) + "%";
  }).join(",") + ")";

  function buildFace() {
    var s = '<svg class="face" viewBox="0 0 100 100" aria-hidden="true"><circle class="rim" cx="50" cy="50" r="47"/>';
    for (var i = 0; i < 12; i += 3) {
      var major = true;
      s += '<line x1="50" y1="' + (major ? 7 : 9) + '" x2="50" y2="' + (major ? 14 : 12) +
           '" stroke="currentColor" stroke-width="' + (major ? 2.2 : 1.2) + '" stroke-linecap="round" opacity="' + (major ? 0.9 : 0.55) +
           '" transform="rotate(' + i * 30 + ' 50 50)"/>';
    }
    s += '<line class="hand h" x1="50" y1="50" x2="50" y2="27" stroke-width="3.6"/>' +
         '<line class="hand m" x1="50" y1="50" x2="50" y2="16" stroke-width="2.4"/>' +
         '<line class="hand sc" x1="50" y1="56" x2="50" y2="12" stroke-width="1" opacity="0.8"/>' +
         '<circle cx="50" cy="50" r="2.6" fill="currentColor"/></svg>';
    return s;
  }

  function makeCard(z) {
    var n = nameFor(z);
    var el = document.createElement("article");
    el.className = "card";
    el.dataset.zone = z;
    el.tabIndex = 0;
    el.setAttribute("aria-label", n.city + " clock");
    el.innerHTML =
      '<div class="top"><div><h2 class="city"></h2><p class="region"></p></div></div>' +
      buildFace() +
      '<div class="digital"><span class="hm"></span><span class="sec"></span><span class="ampm"></span></div>' +
      '<p class="date"></p>' +
      '<div class="strip" title="Position in this city’s day"><span class="marker"></span></div>' +
      '<p class="meta"><span class="off"></span><span class="diff"></span></p>';
    el.querySelector(".city").textContent = n.city;
    if (n.city.length > 12) el.querySelector(".city").classList.add("long");
    el.querySelector(".region").textContent = n.region;
    el.querySelector(".strip").style.background = stripGradient;
    return {
      el: el,
      h: el.querySelector(".h"), m: el.querySelector(".m"), sc: el.querySelector(".sc"),
      hm: el.querySelector(".hm"), sec: el.querySelector(".sec"), ampm: el.querySelector(".ampm"),
      date: el.querySelector(".date"), marker: el.querySelector(".marker"),
      off: el.querySelector(".off"), diff: el.querySelector(".diff")
    };
  }

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function update() {
    var now = new Date();
    var pad2 = function (n) { return String(n).padStart(2, "0"); };
    document.getElementById("utcTime").textContent =
      pad2(now.getUTCHours()) + ":" + pad2(now.getUTCMinutes()) + ":" + pad2(now.getUTCSeconds());
    document.getElementById("utcDate").textContent =
      ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][now.getUTCDay()] + " " +
      now.getUTCDate() + " " + MONTHS[now.getUTCMonth()] + " " + now.getUTCFullYear();
    var base = parts(localTz, now);
    zones.forEach(function (z) {
      var c = cards[z];
      if (!c) return;
      var p = parts(realTz(z), now);
      var frac = p.h + p.mi / 60 + p.s / 3600;

      c.h.setAttribute("transform", "rotate(" + ((p.h % 12) * 30 + p.mi * 0.5) + " 50 50)");
      c.m.setAttribute("transform", "rotate(" + (p.mi * 6 + p.s * 0.1) + " 50 50)");
      c.sc.setAttribute("transform", "rotate(" + p.s * 6 + " 50 50)");

      var hh = p.h, suffix = hh >= 12 ? "PM" : "AM";
      if (!use24) { hh = hh % 12 || 12; }
      c.hm.textContent = (use24 ? String(hh).padStart(2, "0") : hh) + ":" + String(p.mi).padStart(2, "0");
      c.sec.textContent = String(p.s).padStart(2, "0");
      c.ampm.textContent = suffix;

      var dd = p.dayNum - base.dayNum;
      var rel = dd === 0 ? "Today" : dd > 0 ? "Tomorrow" : "Yesterday";
      c.date.textContent = p.wd + " " + p.d + " " + MONTHS[p.mo - 1] + " · " + rel;

      c.marker.style.left = (frac / 24 * 100) + "%";
      var col = TILE_COLOURS[z] || skyAt(frac);
      c.el.style.background = "rgb(" + col.join(",") + ")";
      c.el.style.color = lum(col) > 0.5 ? "#14183a" : "#ffffff";

      c.off.textContent = fmtOffset(p.offset);
      var d = p.offset - base.offset;
      if (z === "local" || d === 0) c.diff.textContent = z === "local" ? "Local" : "Same as you";
      else {
        var ad = Math.abs(d), hrs = Math.floor(ad / 60), mins = ad % 60;
        c.diff.textContent = hrs + (mins ? ":" + String(mins).padStart(2, "0") : "") + " h " + (d > 0 ? "ahead" : "behind");
      }
    });
  }

  function render() {
    grid.innerHTML = "";
    cards = {};
    if (!zones.length) {
      var e = document.createElement("p");
      e.className = "empty";
      e.textContent = "No clocks left. Reload the page to bring them back.";
      grid.appendChild(e);
      return;
    }
    zones.forEach(function (z) {
      cards[z] = makeCard(z);
      grid.appendChild(cards[z].el);
    });
    update();
  }

  /* Drop any saved zone this browser can't handle */
  zones = zones.filter(function (z) { try { getFmt(realTz(z)); return true; } catch (e) { return false; } });

  /* Drag and drop to reorder (hold and drag a tile onto another tile) */
  var drag = null;

  function saveOrder() {
    try { localStorage.setItem("wc-order", JSON.stringify(zones)); } catch (e) {}
  }
  function moveZone(from, to) {
    zones.splice(to, 0, zones.splice(from, 1)[0]);
    saveOrder();
    render();
  }

  grid.addEventListener("pointerdown", function (ev) {
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    var card = ev.target.closest(".card");
    if (!card) return;
    drag = { card: card, sx: ev.clientX, sy: ev.clientY, id: ev.pointerId, active: false, target: null };
  });

  window.addEventListener("pointermove", function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.active) {
      if (Math.hypot(dx, dy) < 8) return;
      drag.active = true;
      drag.card.classList.add("dragging");
      document.body.classList.add("is-dragging");
    }
    drag.card.style.transform = "translate(" + dx + "px, " + dy + "px) scale(1.03)";
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var t = el && el.closest ? el.closest(".card") : null;
    if (t === drag.card) t = null;
    if (t !== drag.target) {
      if (drag.target) drag.target.classList.remove("drop-target");
      if (t) t.classList.add("drop-target");
      drag.target = t;
    }
  });

  function endDrag(ev, cancelled) {
    if (!drag || ev.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    document.body.classList.remove("is-dragging");
    if (!d.active) return;
    d.card.classList.remove("dragging");
    d.card.style.transform = "";
    if (d.target) d.target.classList.remove("drop-target");
    if (!cancelled && d.target) {
      var from = zones.indexOf(d.card.dataset.zone);
      var to = zones.indexOf(d.target.dataset.zone);
      if (from > -1 && to > -1 && from !== to) moveZone(from, to);
    }
  }
  window.addEventListener("pointerup", function (ev) { endDrag(ev, false); });
  window.addEventListener("pointercancel", function (ev) { endDrag(ev, true); });

  /* Keyboard: focus a tile, then Alt + arrow keys to move it */
  grid.addEventListener("keydown", function (ev) {
    var card = ev.target.closest ? ev.target.closest(".card") : null;
    if (!card || !ev.altKey) return;
    var step = (ev.key === "ArrowLeft" || ev.key === "ArrowUp") ? -1 : (ev.key === "ArrowRight" || ev.key === "ArrowDown") ? 1 : 0;
    if (!step) return;
    ev.preventDefault();
    var z = card.dataset.zone, i = zones.indexOf(z), j = i + step;
    if (j < 0 || j >= zones.length) return;
    moveZone(i, j);
    var moved = grid.querySelector('.card[data-zone="' + z + '"]');
    if (moved) moved.focus();
  });

  render();
  setInterval(update, 1000);
})();
</script>
</body>
</html>
